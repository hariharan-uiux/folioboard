services:
  folioboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: folioboard:latest
    container_name: folioboard
    ports:
      - "${FOLIOBOARD_PORT:-8080}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
