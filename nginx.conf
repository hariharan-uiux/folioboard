server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;

    # Compression for text-based assets
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # Basic hardening (inherited by all locations that don't add headers)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Container health check
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Vite emits content-hashed filenames, safe to cache for a year
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        access_log off;
    }

    # Always revalidate the app shell so new deployments are picked up
    location = /index.html {
        expires -1;
    }

    # SPA history fallback: unknown paths load the app
    location / {
        try_files $uri $uri/ /index.html;
    }
}
